[workspace]
members = [".", "adw-askpass", "bw-proto", "bw-key"]

[package]
name = "bw-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bw-agent"
path = "src/main.rs"

[[bin]]
name = "bw-proxy"
path = "src/proxy.rs"

# Windows only: runs bw-agent at logon without a console window.
[[bin]]
name = "bw-agentw"
path = "src/agentw.rs"

[dependencies]
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["sha2"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha1"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
libc = "0.2"
hkdf = "0.12"
toml = "0.8"
bw-proto = { path = "bw-proto" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
bw-key = { path = "bw-key" }

# scrypt at N=2^17 takes seconds per call unoptimised; keep `cargo test` usable.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
strip = true
lto = true
