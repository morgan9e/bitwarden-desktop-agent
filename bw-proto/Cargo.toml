[package]
name = "bw-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
data-encoding = "2"
generic-array = "0.14"
getrandom = "0.2"
libc = "0.2"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
voprf = { version = "0.5", default-features = false, features = ["ristretto255-ciphersuite", "danger", "std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
